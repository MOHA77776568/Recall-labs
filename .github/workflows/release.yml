name: Draft Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching package.json, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Validate release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Release workflow requires a stable semantic package version.');
          }
          const requested = process.env.REF_TYPE === 'tag'
            ? process.env.REF_NAME
            : `v${process.env.INPUT_VERSION}`;
          if (requested !== `v${version}`) {
            throw new Error('Release version must match package.json exactly.');
          }
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - name: Require a new or draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/v${version}`;
          const response = await fetch(url, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
            }
          });
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`Cannot check release status: HTTP ${response.status}`);
            const release = await response.json();
            if (!release.draft) throw new Error('This version is already published. Create a new version instead of replacing its files.');
          }
          NODE
      - name: Build and upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:win -- --publish always
      - name: Keep Windows build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.zip
            dist/*.yml
          if-no-files-found: error
